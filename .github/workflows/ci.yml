name: CI

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: FE Lint (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [mermaid, markdown, chartjs]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/${{ matrix.component }}/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/${{ matrix.component }}/frontend
        run: npm ci

      - name: Lint
        working-directory: src/${{ matrix.component }}/frontend
        run: npm run lint
