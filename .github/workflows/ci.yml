name: CI

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: FE Lint (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [mermaid, markdown, chartjs, voice]

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: src/${{ matrix.component }}/frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: src/${{ matrix.component }}/frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: src/${{ matrix.component }}/frontend
        run: pnpm run lint
