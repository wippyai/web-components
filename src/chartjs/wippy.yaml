organization: wippy-wc-extras
module: chartjs
description: >
  Provides the <wippy-chartjs> custom element for rendering Chart.js v4 charts.
  Supports all built-in types (line, bar, doughnut, pie, radar, polarArea, scatter,
  bubble). Auto-fills dataset colors from the host CSS palette. Part of wippy-wc-extras.
license: Apache-2.0
repository: https://github.com/wippyai/web-components
homepage: https://wippy.ai
keywords:
  - web-components
  - chartjs
  - charts
  - visualization
embed: ["public_files"]
exclude_meta:
  type: [test]
  scope: [dev]
