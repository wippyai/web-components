version: "1.0"
namespace: wippy-swiss.echarts

entries:
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta:
      title: ECharts Web Component
      description: |
        Provides the <wippy-echarts> custom element. Drop into any app via
        `ns.dependency`, wire the `server` requirement to your gateway, and
        consumers call loadByTagName('wippy-echarts') to register the tag lazily.

        Renders ECharts 6.1 charts from a JSON option; the engine loads on first render.
        Text, axes, borders and categorical colors follow the host CSS.
        Part of the wippy-swiss collection.

  - name: server
    kind: ns.requirement
    meta:
      description: The http.service entry that hosts this module's static bundle, typically your app's gateway.
    targets:
      - entry: wippy-swiss.echarts:static
        path: .meta.server

  - name: public_files
    kind: fs.directory
    meta:
      comment: Built echarts web component bundle
    directory: ./public/
    mode: "0755"

  - name: static
    kind: http.static
    meta:
      comment: Serves echarts web component bundle
      server: server
    fs: public_files
    directory: /
    path: /@static-wippy-swiss/echarts
    options:
      mime_types:
        .js: application/javascript
        .css: text/css
        .map: application/json

  - name: wippy-echarts
    kind: registry.entry
    meta:
      type: view.component
      name: wippy-echarts
      title: ECharts
      tag_name: wippy-echarts
      entry_point: index.js
      announced: true
      secure: false
      auto_register: false
      url: /@static-wippy-swiss/echarts
      description: "Renders ECharts 6.1 line, bar, pie, scatter, heatmap, funnel, gauge and radar charts from the JSON string in options. Includes grid, tooltip, legend, dataset, aria, title, inside/slider dataZoom, marks, visualMap, calendar and radar coordinates; Canvas and SVG renderers. Maps, graph, sankey and toolbox are excluded. Registry announced=true and auto_register=false: consumers must await loadByTagName('wippy-echarts') from @wippy-fe/proxy. The separate cached ECharts chunk loads only before a valid, sized chart renders; lazy-init=true also waits until within 200px of the viewport. Give the element a height, such as style=\"height:300px\". Text, muted text, borders, surfaces and fonts read resolved --p-* tokens from the custom element host. Auto follows host.getThemeMode() and @theme; theme-mode overrides ECharts contrast mode locally without changing the host. Palette precedence: palette JSON array, --wippy-chart-1..8, documented categorical fallback. options is always the complete desired JSON ECharts option, never a patch, in both merge modes. not-merge defaults true; false uses native merge on the live chart for animated data updates and retained zoom/legend state unless the option overrides them. Theme, palette or renderer changes dispose and recreate from the current full option, deliberately resetting interaction and accumulated media state. Only the latest full option is used during lazy loading; there is no patch history or lifetime update limit. JSON functions never execute. Tooltips stay in the shadow root and aria defaults on. label supplies a figure name. autoresize, loading/loading-text, not-merge, lazy-update and group control rendering. Emits chart-click/chart-dblclick/chart-hover with chartjs detail {label,datasetLabel,datasetIndex,dataIndex,value}; legend-change {selected}; datazoom {start,end}; chart-rendered {}; chart-error {message}. All custom events bubble and are composed. Invalid JSON or initialization errors show an alert and emit chart-error. Example: <wippy-echarts options='{\"series\":[{\"type\":\"pie\",\"data\":[{\"name\":\"A\",\"value\":1}]}]}' label=\"Share\" style=\"height:300px\"></wippy-echarts>."
      props:
        type: "object"
        properties:
          options:
            type: "string"
            default: ""
            description: "Complete desired ECharts option as a JSON string, always a full option and never a patch, including with not-merge=false. Empty means {}. Include all settings needed to initialize a fresh chart. Formatter callbacks accept {$format: spec}, for example {\"tooltip\":{\"trigger\":\"axis\",\"axisPointer\":{\"label\":{\"formatter\":{\"$format\":\"date\"}}}}}. Specs: number, number:0..20, compact, percent, integer, date, datetime, month, time:<ECharts template>. Uses document language, then browser locale. Unknown specs warn and use defaults. JSON strings never execute."
          theme-mode:
            type: "string"
            default: "auto"
            description: "Auto follows the host theme mode; light/dark override ECharts contrast mode locally. Resolved host tokens remain authoritative."
            enum: ["auto","light","dark"]
          palette:
            type: "string"
            default: ""
            description: "JSON array of color strings. Overrides --wippy-chart-1..8 and the documented fallback palette. Empty uses CSS colors."
          renderer:
            type: "string"
            default: "canvas"
            description: "ECharts rendering backend. Changing it disposes and recreates from the current full option, resetting zoom, legend selection and other interaction state."
            enum: ["canvas","svg"]
          autoresize:
            type: "boolean"
            default: true
            description: "Resize with the container using ResizeObserver."
          loading:
            type: "boolean"
            default: false
            description: "Show the ECharts loading state using theme colors."
          loading-text:
            type: "string"
            default: "Loading…"
            description: "Text in the ECharts loading state."
          not-merge:
            type: "boolean"
            default: true
            description: "Controls how a new full option is applied to the live chart. True replaces (default); false uses native ECharts merge for data animation and retained zoom/legend state unless explicitly overridden. Never enables patch input."
          lazy-update:
            type: "boolean"
            default: false
            description: "Defer the ECharts option update until the next animation frame."
          group:
            type: "string"
            default: ""
            description: "ECharts connect group id. Empty disables group membership."
          label:
            type: "string"
            default: "Chart"
            description: "Accessible name of the chart figure."
          lazy-init:
            type: "boolean"
            default: false
            description: "Wait until within 200px of the viewport before loading ECharts and initializing. Falls back to immediate initialization without IntersectionObserver."
      events:
        type: "object"
        properties:
          chart-click:
            type: "object"
            description: "Data element event; empty space emits nothing. Bubbles and is composed."
            properties:
              label:
                type: "string"
                description: "Category or x value as text."
              datasetLabel:
                type: "string"
                description: "Series name."
              datasetIndex:
                type: "number"
                description: "Series index."
              dataIndex:
                type: "number"
                description: "Index within the series."
              value:
                description: "Raw data point or dataset row, matching wippy-chartjs."
          chart-dblclick:
            type: "object"
            description: "Data element event; empty space emits nothing. Bubbles and is composed."
            properties:
              label:
                type: "string"
                description: "Category or x value as text."
              datasetLabel:
                type: "string"
                description: "Series name."
              datasetIndex:
                type: "number"
                description: "Series index."
              dataIndex:
                type: "number"
                description: "Index within the series."
              value:
                description: "Raw data point or dataset row, matching wippy-chartjs."
          chart-hover:
            type: "object"
            description: "Data element event; empty space emits nothing. Bubbles and is composed."
            properties:
              label:
                type: "string"
                description: "Category or x value as text."
              datasetLabel:
                type: "string"
                description: "Series name."
              datasetIndex:
                type: "number"
                description: "Series index."
              dataIndex:
                type: "number"
                description: "Index within the series."
              value:
                description: "Raw data point or dataset row, matching wippy-chartjs."
          legend-change:
            type: "object"
            description: "Legend selection changed. Bubbles and is composed."
            properties:
              selected:
                type: "object"
                additionalProperties:
                  type: "boolean"
                description: "Series name to selected state."
          datazoom:
            type: "object"
            description: "First affected dataZoom range, in percent; null if a value-based action omitted percentages. Bubbles and is composed."
            properties:
              start:
                type: ["number","null"]
                description: "Start percentage or null."
              end:
                type: ["number","null"]
                description: "End percentage or null."
          chart-rendered:
            type: "object"
            description: "Empty detail after ECharts finished animations, progressive rendering and lazy updates. Bubbles and is composed."
            properties: {}
          chart-error:
            type: "object"
            description: "Parse, import or initialization error. Bubbles and is composed."
            properties:
              message:
                type: "string"
                description: "Error message."
