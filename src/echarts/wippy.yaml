organization: wippy-swiss
module: echarts
description: >
  Provides the lazy <wippy-echarts> custom element for ECharts 6.1 charts from
  a JSON option. Supports eight chart types, host theme tokens, Canvas and SVG,
  configurable props and seven chart events. Consumers call loadByTagName.
