organization: wippy-wc-extras
module: markdown
description: >
  Provides the <wippy-markdown> custom element for rendering GitHub-Flavored Markdown
  to sanitized HTML. Uses markdown-it for parsing and sanitize-html for output safety.
  Conservative default allowlist; widening is a security decision. Part of wippy-wc-extras.
license: Apache-2.0
repository: https://github.com/wippyai/web-components
homepage: https://wippy.ai
keywords:
  - web-components
  - markdown
  - sanitize-html
embed: ["public_files"]
exclude_meta:
  type: [test]
  scope: [dev]
