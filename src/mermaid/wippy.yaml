organization: wippy-swiss
module: mermaid
description: >
  Provides the <wippy-mermaid> custom element for rendering Mermaid v11 diagrams.
  Supports all diagram types via a fast primary engine (flowchart, sequence, class,
  ER, state, xychart) with a lazy-loaded fallback for the rest. Part of wippy-swiss.
license: Apache-2.0
repository: https://github.com/wippyai/web-components
homepage: https://wippy.ai
keywords:
  - web-components
  - mermaid
  - diagrams
embed: ["public_files"]
exclude_meta:
  type: [test]
  scope: [dev]
