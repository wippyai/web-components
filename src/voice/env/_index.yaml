version: "1.0"
namespace: wippy-swiss.voice.env
entries:
  - name: envs
    kind: env.storage.os
    meta:
      comment: OS storage for voice environment variables
      type: envstorage

  - name: tts_provider
    kind: env.variable
    meta:
      comment: TTS provider (deepgram or elevenlabs)
      icon: tabler:volume
    default: deepgram
    storage: wippy-swiss.voice.env:envs
    variable: TTS_PROVIDER

  - name: deepgram_api_key
    kind: env.variable
    meta:
      comment: Deepgram API key for TTS and STT
      icon: tabler:key
      private: true
    storage: wippy-swiss.voice.env:envs
    variable: DEEPGRAM_API_KEY

  - name: deepgram_model
    kind: env.variable
    meta:
      comment: Deepgram TTS voice model
      icon: tabler:settings
    default: aura-asteria-en
    storage: wippy-swiss.voice.env:envs
    variable: DEEPGRAM_MODEL

  - name: elevenlabs_api_key
    kind: env.variable
    meta:
      comment: ElevenLabs API key
      icon: tabler:key
      private: true
    storage: wippy-swiss.voice.env:envs
    variable: ELEVENLABS_API_KEY

  - name: elevenlabs_voice_id
    kind: env.variable
    meta:
      comment: ElevenLabs voice ID
      icon: tabler:user
    storage: wippy-swiss.voice.env:envs
    variable: ELEVENLABS_VOICE_ID

  - name: elevenlabs_model_id
    kind: env.variable
    meta:
      comment: ElevenLabs model ID
      icon: tabler:settings
    default: eleven_flash_v2_5
    storage: wippy-swiss.voice.env:envs
    variable: ELEVENLABS_MODEL_ID

  - name: stt_provider
    kind: env.variable
    meta:
      comment: STT provider (deepgram or whisper)
      icon: tabler:microphone
    default: deepgram
    storage: wippy-swiss.voice.env:envs
    variable: STT_PROVIDER
